<html>
    <head>
        <title>Canvas prueba</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <div></div>
    </body>
    <canvas id="canvas" style="width: 500px; height: 500px; border: 1px solid black; background-color: antiquewhite;"></canvas>
    <script>
        const c = document.getElementById("canvas");
        const ctx = c.getContext("2d");
        ctx.fillStyle = "red";
        ctx.fillRect(100, 100, 200, 50);
    </script>
